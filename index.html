<!DOCTYPE html>
<html>
<head>
  <title>LAR Engine</title>
  <script type="module">
    import { lar } from "./LAR.js";

    function run() {
      const name = document.getElementById("modul").value;
      const out  = lar(name);
      document.getElementById("out").innerText = JSON.stringify(out, null, 2);
    }
  </script>
</head>
<body>
  <h1>LAR Engine</h1>
  <input id="modul" placeholder="tmp007 / vec118 / re200">
  <button onclick="run()">LAR testen</button>
  <pre id="out"></pre>
</body>
</html>
